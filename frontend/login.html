<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Glass Export</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-login">
    <div class="login-container">
        <div class="login-box">
            <h2>Glass Export ERP</h2>
            <p>Acesse o painel Back-office</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="admin@glassexport.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" required placeholder="******">
                </div>
                <button type="submit" class="btn-primary">Entrar no Sistema</button>
            </form>
            <div id="loginError" class="msg-erro" style="display: none;">Dados incorretos.</div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
